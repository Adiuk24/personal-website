<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>arifadito.com API</title></head>
<body>
  <p>API backend for <a href="https://arifadito.com">arifadito.com</a>.</p>
  <form name="booking" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="company" />
    <input type="text" name="topic" />
    <input type="text" name="preferred_time" />
    <textarea name="notes"></textarea>
  </form>
</body>
</html>
